name: "Python CI"

on:
  push:
    branches:
      - main
    paths:
      - "fasm_pipeline/**"
      - "docker/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "fasm_pipeline/**"
      - "docker/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to run"
        type: choice
        default: "3.12"
        options:
          - "3.12"

permissions:
  contents: read

jobs:
  setup-matrix:
    name: "Setup Python Matrix"
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - id: set-matrix
        run: |
          echo 'versions=["3.12"]' >> $GITHUB_OUTPUT

  lint-and-format:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run Ruff Format Check
        run: uv run --group dev ruff format --check .

      - name: Run Ruff Lint Check
        run: uv run --group dev ruff check .

  security-review:
    name: "Security Review"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
        with:
          scan-args: |
            --recursive
            ./

  test:
    name: "Test (Python ${{ matrix.python-version }})"
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.setup-matrix.outputs.versions) }}
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev
          if [ -f requirements.txt ]; then
            uv pip install -r requirements.txt
          fi
          uv pip install -e .

      - name: Run pytest
        run: uv run pytest
