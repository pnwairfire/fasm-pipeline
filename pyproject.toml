[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasm-pipeline"
version = "0.1.0"
description = "FASM wildfire & air-quality ETL pipelines. Prefect-agnostic."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.26",
    "geopandas>=0.13",
    "GeoAlchemy2>=0.13",
    "numpy>=1.24",
    "pandas>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "shapely>=2.0",
    "SQLAlchemy>=2.0",
]

# `fasm-pipeline <stream>` (== `python -m fasm_pipeline <stream>`) runs one
# pipeline end-to-end and logs to stdout. This is the interface an orchestrator
# (Prefect on ECS/Fargate/EC2, cron, etc.) invokes.
[project.scripts]
fasm-pipeline = "fasm_pipeline.__main__:main"

# The pipeline logic is an importable package; SQL files ship inside it.
[tool.setuptools.packages.find]
include = ["fasm_pipeline*"]

[tool.setuptools.package-data]
fasm_pipeline = ["sql/*.sql"]


[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "S"]
ignore = ["S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
